<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Estudiante — Quiz previo</title>
  <link rel="stylesheet" href="/css/quiz.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/questions.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card" id="join">
      <h1>Unirse al quiz</h1>
      <p class="muted">Ingresá el código de la sala (o escaneá el QR del proyector).</p>
      <label class="muted" for="code">Código</label>
      <input id="code" maxlength="6" placeholder="ABCD"
        style="width:100%;font-size:1.6rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.8rem;border-radius:12px;border:2px solid var(--line);margin:0.4rem 0 0.8rem" />
      <label class="muted" for="name">Apodo (opcional)</label>
      <input id="name" maxlength="24" placeholder="Tu nombre"
        style="width:100%;font-size:1.1rem;padding:0.7rem;border-radius:12px;border:2px solid var(--line);margin:0.4rem 0 1rem" />
      <button class="btn big" id="btn-join">Entrar</button>
      <p class="footer-note" id="join-error" style="color:var(--bad)"></p>
    </div>

    <div class="card" id="wait" hidden>
      <h2>¡Listo!</h2>
      <p class="muted">Esperá a que la docente inicie el quiz…</p>
      <div class="pill">Sala <span id="wait-code"></span></div>
    </div>

    <div class="card" id="play" hidden>
      <div class="row">
        <div class="pill" id="progress">1 / 11</div>
        <div class="grow"></div>
        <div class="timer" id="timer">35</div>
      </div>
      <div class="topic" id="topic"></div>
      <p class="prompt" id="prompt"></p>
      <div class="options" id="options"></div>
      <p class="footer-note" id="status"></p>
    </div>

    <div class="card" id="reveal" hidden>
      <div class="row">
        <div class="pill" id="reveal-progress">Resultados</div>
      </div>
      <div class="topic" id="reveal-topic"></div>
      <p class="prompt" id="reveal-prompt"></p>
      <p id="explanation"></p>
      <img class="figure" id="figure" alt="Figura explicativa" />
      <div class="bars" id="bars"></div>
      <p class="footer-note">Esperá a que la docente avance a la siguiente pregunta…</p>
    </div>

    <div class="card" id="done" hidden>
      <h1>¡Gracias!</h1>
      <p class="muted">Fin del quiz previo.</p>
    </div>
  </div>

  <script src="/js/student.js"></script>
</body>
</html>
