<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="A times A inverse equals I">
  <rect width="640" height="280" fill="#fbfcfe"/>
  <rect x="50" y="90" width="140" height="90" rx="10" fill="#e8f0fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#1f4e79" font-family="Arial, Helvetica, sans-serif">A = X'X</text>
  <text x="210" y="145" font-size="28" fill="#152033" font-family="Arial, Helvetica, sans-serif">*</text>
  <rect x="250" y="90" width="140" height="90" rx="10" fill="#fff3e6" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#d97706" font-family="Arial, Helvetica, sans-serif">A^(-1)</text>
  <text x="410" y="145" font-size="28" fill="#152033" font-family="Arial, Helvetica, sans-serif">=</text>
  <rect x="450" y="90" width="140" height="90" rx="10" fill="#eaf8f0" stroke="#1b7f4a" stroke-width="2"/>
  <text x="520" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#1b7f4a" font-family="Arial, Helvetica, sans-serif">I</text>
  <text x="320" y="230" text-anchor="middle" font-size="16" fill="#152033" font-family="Arial, Helvetica, sans-serif">Inverse definition: A * A^(-1) = I</text>
</svg>
