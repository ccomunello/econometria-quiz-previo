<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Log-level interpretation">
  <rect width="640" height="280" fill="#fbfcfe"/>
  <rect x="70" y="60" width="500" height="140" rx="16" fill="#e8f0fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="320" y="115" text-anchor="middle" font-size="22" font-weight="700" fill="#1f4e79" font-family="Arial, Helvetica, sans-serif">log(wage) = ... + 0.08 * educ</text>
  <text x="320" y="160" text-anchor="middle" font-size="20" fill="#1b7f4a" font-family="Arial, Helvetica, sans-serif">~ +8% in wage per extra year of educ</text>
  <text x="320" y="240" text-anchor="middle" font-size="15" fill="#5b6b82" font-family="Arial, Helvetica, sans-serif">log-level rule: 100 * beta ~ percent change</text>
</svg>
