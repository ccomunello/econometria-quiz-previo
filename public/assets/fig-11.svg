<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="280" fill="#fbfcfe"/>
  <text x="320" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">X2X es simétrica: (X2X)2 = X2X</text>
  <rect x="180" y="70" width="280" height="160" rx="12" fill="#e8f0fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="250" y="130" text-anchor="middle" font-size="18" fill="#152033">a</text>
  <text x="390" y="130" text-anchor="middle" font-size="18" fill="#2f80ed">b</text>
  <text x="250" y="180" text-anchor="middle" font-size="18" fill="#2f80ed">b</text>
  <text x="390" y="180" text-anchor="middle" font-size="18" fill="#152033">c</text>
  <line x1="320" y1="90" x2="320" y2="210" stroke="#d7e0ec" stroke-width="2"/>
  <line x1="200" y1="150" x2="440" y2="150" stroke="#d7e0ec" stroke-width="2"/>
  <text x="320" y="255" text-anchor="middle" font-size="14" fill="#5b6b82">elementos espejo iguales (b = b)</text>
</svg>
