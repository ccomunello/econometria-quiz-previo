<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Estimacion vs inferencia">
  <rect width="640" height="280" fill="#fbfcfe"/>
  <rect x="30" y="40" width="260" height="200" rx="14" fill="#e8f0fb" stroke="#1f4e79" stroke-width="2"/>
  <rect x="350" y="40" width="260" height="200" rx="14" fill="#eaf8f0" stroke="#1b7f4a" stroke-width="2"/>
  <text x="160" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#1f4e79" font-family="Arial, sans-serif">Estimacion</text>
  <text x="160" y="125" text-anchor="middle" font-size="15" fill="#152033" font-family="Arial, sans-serif">muestra &#8594; formula</text>
  <text x="160" y="165" text-anchor="middle" font-size="30" font-weight="700" fill="#2f80ed" font-family="Arial, sans-serif">&#952;&#770;</text>
  <text x="160" y="205" text-anchor="middle" font-size="14" fill="#5b6b82" font-family="Arial, sans-serif">un numero (o vector)</text>
  <text x="480" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#1b7f4a" font-family="Arial, sans-serif">Inferencia</text>
  <text x="480" y="125" text-anchor="middle" font-size="15" fill="#152033" font-family="Arial, sans-serif">&#952;&#770; + incertidumbre</text>
  <text x="480" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#1b7f4a" font-family="Arial, sans-serif">test / IC</text>
  <text x="480" y="205" text-anchor="middle" font-size="14" fill="#5b6b82" font-family="Arial, sans-serif">afirmacion sobre &#952;</text>
</svg>
