<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Ambos productos dan I">
  <rect width="640" height="280" fill="#fbfcfe"/>
  <rect x="40" y="50" width="560" height="80" rx="12" fill="#e8f0fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="#1f4e79" font-family="Arial, sans-serif">A^(-1) * A = I</text>
  <rect x="40" y="150" width="560" height="80" rx="12" fill="#eaf8f0" stroke="#1b7f4a" stroke-width="2"/>
  <text x="320" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#1b7f4a" font-family="Arial, sans-serif">A * A^(-1) = I</text>
  <text x="320" y="260" text-anchor="middle" font-size="15" fill="#5b6b82" font-family="Arial, sans-serif">con A = X'X (ambos lados dan la identidad)</text>
</svg>
